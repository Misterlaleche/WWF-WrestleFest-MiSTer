[parse]
main="wwfwfest"
sourcefile=["ddragon3.cpp"]

[parse.mustbe]
machines=["wwfwfest"]

[buttons]
Names = [
    { names="Punch,Kick" },
]

[dipsw]
delete=[
    { names=["Unused"] }
]

[ROM]
regions=[
    { name="maincpu", width=16, reverse=true, files=[
        { name="31e13-0.ic19", size=0x40000, crc="bd02e3c4", offset=1 },
        { name="31e14-0.ic18", size=0x40000, crc="933ea1a0", offset=0 },
    ] },
    { name="audiocpu", start="JTFRAME_BA1_START", files=[
        { name="31a11-2.ic42", size=0x10000, crc="5ddebfea" },
    ] },
    { name="oki", start="PCM_START", files=[
        { name="31j10.ic73", size=0x80000, crc="6c522edb" },
    ] },
    { name="gfx1", start="JTFRAME_BA2_START", files=[
        { name="31e12-0.ic33", size=0x20000, crc="06f22615" },
    ] },
    # The two scroll ROM halves carry two bitplanes each.
    { name="gfx3", start="SCR_START", width=16, no_offset=true, files=[
        { name="31j1.ic2", size=0x40000, crc="82ed7155", offset=0 },
        { name="31j0.ic1", size=0x40000, crc="8a12b450", offset=0x40000 },
    ] },
    # Four sprite planes occupy four 2 MiB quarters. Interleave matching
    # 1 MiB devices from each quarter into one 32-bit graphics word.
    { name="gfx2", start="JTFRAME_BA3_START", width=32, sequence=[0,2,4,6,1,3,5,7], no_offset=true, files=[
        { name="31j3.ic9",  size=0x100000, crc="e395cf1d" },
        { name="31j2.ic8",  size=0x100000, crc="b5a97465" },
        { name="31j5.ic11", size=0x100000, crc="2ce545e8" },
        { name="31j4.ic10", size=0x100000, crc="00edb66a" },
        { name="31j6.ic12", size=0x100000, crc="79956cf8" },
        { name="31j7.ic13", size=0x100000, crc="74d774c3" },
        { name="31j9.ic15", size=0x100000, crc="dd387289" },
        { name="31j8.ic14", size=0x100000, crc="44abe127" },
    ] },
]

order=[
    "maincpu", "audiocpu", "oki", "gfx1", "gfx3", "gfx2",
]
